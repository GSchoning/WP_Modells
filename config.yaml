# Precipice Sandstone POC — runtime configuration.
#
# Paths are relative to the repository root. Inside the Docker container the
# repo root is mounted at /app, so paths resolve identically.

project:
  name: "precipice_poc"
  # Project CRS = GDA94 / MGA Zone 55 (matches the Geometry shapefiles and
  # the X/Y columns in Properties_recharge/properties.csv).
  crs: "EPSG:28355"

inputs:
  # Aquifer geometry --------------------------------------------------------
  formation_extent: "Data/Geometry/Edge around Precipice Sandstone 2017 Rev2B revised.shp"
  outcrop:          "Data/Geometry/Precipice_outcrop_regional_geomodel_2017_250m.shp"

  # Per-cell properties already on a structured grid (kx, SS, rch, IBOUND,
  # OUTCROP, NTOP, NBOT, THICKNESS, X, Y). Replaces the K/Ss/recharge GeoTIFFs
  # described in CLAUDE.md §5; the grid is read directly from this table.
  properties_csv: "Data/Properties_recharge/properties.csv"

  # NOTE: PCP_DEM.tif is the structure surface of the Precipice BASE, not
  # ground topography (verified 2026-07: matches model NBOT, median offset
  # -0.4 m, corr 0.99998 — sits ~33 m below ground even in outcrop). Only
  # used as the drain-elevation fallback when drains.riv_cells_csv is
  # absent; replace with the real topographic DEM when supplied.
  dem: "Data/DEM/PCP_DEM.tif"

  # The properties CSV's rch column is empty, so recharge is supplied
  # per-cell from this OGIA steady-state export (INODE, RCH_SS_m_per_day),
  # applied at exactly the cells OGIA recharges (northern exposed-outcrop
  # belt, 215 cells, ~12,400 ML/yr). Recharge cancels in the twin-
  # differenced drawdown; it shapes the IC and drain states.
  recharge_csv: "Data/Properties_recharge/Precipice_L24_SS_recharge.csv"
  # Uniform-over-outcrop last resort if neither rch column nor the CSV
  # above provides values (UWIR balance ÷ area = 5.63e-5 m/d).
  recharge_fallback_m_per_day: 5.63e-5

  # Parent-model calibrated boundary GHBs (48 western-face cells with
  # calibrated head AND conductance, extracted from the UWIR 2025 GHB
  # package). Supersedes the transcribed pilot-head interpolation with
  # estimated C = K·b; comment out to revert to that behaviour.
  ghb_cells_csv: "Data/Properties_recharge/ghb_cells.csv"

  # Water-use database. Coordinates GIS_LAT/GIS_LNG are GDA94 geographic
  # (EPSG:4283) and are reprojected to the project CRS on ingest.
  water_use:
    path: "Data/Water Use/WATERUSE_GDA94.csv"
    source_crs: "EPSG:4283"
    lon_col: "GIS_LNG"
    lat_col: "GIS_LAT"
    id_col: "RN"
    # Annual extraction column (megalitres / year). Converted to m3/d on ingest.
    rate_col: "ML_Aquifer"
    rate_units: "ML/year"
    # Filter to Precipice Sandstone only.
    formation_col: "FORMATION"
    formation_value: "Precipice Sandstone"
    # Receptor classification: per user, receptor bores = bores that are NOT
    # stock-and-domestic (i.e. licensed extractions). Pumping bores in
    # Scenario A = all bores with a non-zero ML_Aquifer.
    receptor_filter:
      column: "OGIA_P3"
      exclude_values: ["Stock_Domestic"]
    # Licensed take = entitlement bores (hold an authority number) that are
    # not Stock&Domestic. Reported as the separate s_licensed impact layer.
    licensed_filter:
      auth_col: "AUTH_REFS"
      exclude_column: "OGIA_P3"
      exclude_values: ["Stock_Domestic"]

  # Springs shapefile. CRS is WGS84 Web Mercator (EPSG:3857); io_layer
  # reprojects to the project CRS on ingest.
  springs: "Data/Springs/Active springs_POINT_rJliS3wVll.shp"

  # Proposed new bore (Scenario C). Either inline or a single-row CSV.
  proposed_bore:
    bore_id: "PROPOSED_001"
    x: null               # easting in project CRS (m) — TBD
    y: null               # northing in project CRS (m) — TBD
    rate_ML_per_year: null   # ML/year — converted to m³/d at runtime

aquifer:
  # NTOP/NBOT and THICKNESS are read per-cell from properties.csv, so these
  # fallbacks are only used for cells where those columns are missing.
  thickness_m: 200
  top_elevation_m: 0

grid:
  # The native grid in properties.csv is on a 1500 m spacing (X/Y stepped at
  # 1500 m in the sample rows). Re-using it directly avoids a resample step.
  source: "properties_csv"
  buffer_m: 50000
  boundary_type: "no_flow"      # or "chd_regional_gradient"

time:
  total_years: 100
  nstp: 30
  tsmult: 1.2
  # Yearly steps for the first N years so early-time drawdown is well
  # resolved; the remaining (total_years - fine_period_years) is broken
  # into nstp geometric steps. Set to 0 to disable.
  fine_period_years: 10
  output_years: [10, 50, 100]

solver:
  complexity: "MODERATE"        # MODERATE | COMPLEX

run:
  scenarios: ["A", "C", "L"]    # B = A + C by superposition; L = licensed-take subset of A
  workspace_root: "/tmp/mf6_workspaces"

assessment:
  # Spring drawdown trigger threshold for WATER-BORE licence assessments
  # (this tool's use case). Note: the 0.2 m trigger quoted in the UWIR
  # 2025 report is the CSG / petroleum-and-gas spring threshold and does
  # NOT apply here — do not "correct" this value to 0.2.
  regulatory_threshold_m: 0.4
  spring_complex_col: complex_na
  spring_id_col: site_no
  recharge_multiplier: 1.0
  # Lateral boundary treatment, following the UWIR 2025 modelling report
  # (App. F Fig F.1-15): the parent model closes every natural pinch-out
  # edge and assigns GHBs only where the Precipice is truncated by the
  # western model-domain frame. Our boundary audit
  # (outputs/boundary_audit.csv) agrees: the perimeter is almost
  # entirely a thin pinch-out fringe (thickness p50 6-19 m vs 44 m
  # interior) and the western truncation face is the one transmissive
  # corridor (T p50 ~158 m²/d). Set to "no_flow" to close the perimeter
  # entirely (fully conservative sensitivity case).
  boundary_mode: "uwir_ghb"
  # UWIR 2025 (App. F Fig F.1-15): layer 24 carries GHBs on the WESTERN
  # truncation face only (the 2019 model also had southern GHBs — no
  # longer the case). Our west-face active cells are exactly the parent
  # model's GHB strip (IROW 127-187, northing ~7,165-7,256 km).
  ghb_faces: ["W"]
  ghb_conductance_scale: 1.0   # C = K·b per cell; 2025 report doesn't document the basis
  # Heads = calibrated posterior pilot values from Fig G.1-39 (423-706 m
  # AHD along the strip), interpolated by row. Head cancels in drawdown;
  # this improves the IC and drain-state classification.
  ghb_heads: "uwir2025_pilot"
  # Outcrop (water-table) cells all carry the formation-wide outcrop Sy
  # (1.6293e-2 in the export), per UWIR 2025 Table B.2-2 where outcrop
  # Sy is one formation-wide parameter. "as_exported" reverts to the
  # export's mixed per-cell magnitudes.
  outcrop_storage: "formation_sy"
  # CHD placement used only in "chd_quadrants" mode, and as the final
  # convergence fallback.
  chd_quadrants: ["NW", "SE"]

# Rejected-recharge drains in the outcrop, mirroring the parent regional
# model, which implements them as RIV cells with stage == rbot (user-
# confirmed; the model's DRN package is something else). riv_cells.csv is
# extracted from the UWIR 2025 RIV package by scripts/extract_uwir2025.py
# and carries the CALIBRATED stage (drain elevation) and conductance per
# cell — it supersedes the old min-DEM elevation + K·A/b estimate, which
# remains the fallback when the file is absent. Steady state uses real
# DRN cells; transient runs use the linearised (GHB) form so
# superposition stays exact.
drains:
  enabled: true
  riv_cells_csv: "Data/Properties_recharge/riv_cells.csv"
  conductance_m2_per_day: null   # null = calibrated per-cell RIV conductance
  conductance_scale: 1.0
