name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # pytest lives in the [dev] extra; install it explicitly rather than
        # pulling the whole dev group (ruff, jupyterlab) into CI.
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Install MODFLOW 6
        run: |
          mkdir -p "$HOME/.local/bin"
          python -m flopy.utils.get_modflow "$HOME/.local/bin" --subset mf6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify mf6
        run: mf6 --version

      # Theis, superposition, and end-to-end tests all exercise the real
      # MF6 binary on small synthetic grids — this is the model-correctness
      # gate, not just a lint pass.
      - name: Run tests
        run: pytest -x -q
