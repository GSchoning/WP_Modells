# Hutton Sandstone — runtime configuration.
#
# Mirrors config.yaml (the Precipice POC) with Hutton-specific inputs from
# the UWIR 2025 extraction (scripts/extract_uwir2025.py). The Hutton is
# split across parent-model layers 19 (Upper) + 20 (Lower); the grid
# builder merges them per cell (see grid._merge_layer_rows).

project:
  name: "hutton_poc"
  crs: "EPSG:28355"                # GDA94 / MGA Zone 55

inputs:
  # Model-derived extent (dissolved active cells) and outcrop (negative-SS
  # water-table cells) — stand-ins until official OGIA polygons arrive.
  formation_extent: "Data/Hutton/extent.shp"
  outcrop:          "Data/Hutton/outcrop.shp"

  properties_csv: "Data/Hutton/properties.csv"

  # No topographic DEM yet (see docs/data_request_hutton_gubberamunda.md);
  # drains take calibrated stages from riv_cells_csv, so none is needed.
  dem: null

  # Steady-state recharge at ALL water-table recharge nodes (both layers).
  recharge_csv: "Data/Hutton/recharge_SS.csv"
  predev_heads_csv: "Data/Hutton/predev_heads.csv"
  # UWIR-balance fallback deliberately unset — the per-cell field is
  # authoritative for the Hutton.
  recharge_fallback_m_per_day: null

  # Parent-model calibrated boundary GHBs (western heads + southern
  # conductances, layers 19 and 20 merged per cell).
  ghb_cells_csv: "Data/Hutton/ghb_cells.csv"

  # Full 2024 water-use table (all formations); filtered on FORMATION.
  water_use:
    path: "Data/Water Use/WU14_Wateruse_current_2024_UWIR_20250529.csv"
    source_crs: "EPSG:4283"
    lon_col: "GIS_LNG"
    lat_col: "GIS_LAT"
    id_col: "RN"
    rate_col: "ML_Aquifer"
    rate_units: "ML/year"
    formation_col: "FORMATION"
    formation_value: "Hutton Sandstone"    # single string covers L19+L20
    receptor_filter:
      column: "OGIA_P3"
      exclude_values: ["Stock_Domestic"]
    # Licensed take = entitlement bores (hold an authority number) that are
    # not Stock&Domestic. Reported as the separate s_licensed impact layer.
    licensed_filter:
      auth_col: "AUTH_REFS"
      exclude_column: "OGIA_P3"
      exclude_values: ["Stock_Domestic"]

  # Shared springs layer; keep only springs attributed to the Hutton
  # (source_aqu) — 48 of 390.
  springs: "Data/Springs/Active springs_POINT_rJliS3wVll.shp"
  springs_attr_filter:
    column: "source_aqu"
    contains: "Hutton"
  # All Hutton-attributed springs stay in regardless of outcrop distance
  # (union rule; artesian complexes discharge through the cover).
  springs_attr_keep:
    column: "source_aqu"
    contains: "Hutton"

  proposed_bore:
    bore_id: "PROPOSED_001"
    x: null
    y: null
    rate_ML_per_year: null

aquifer:
  # Fallbacks only; NTOP/NBOT/THICKNESS come per-cell from properties.csv.
  thickness_m: 250
  top_elevation_m: 0

grid:
  source: "properties_csv"
  buffer_m: 50000
  boundary_type: "no_flow"
  # Upper + Lower Hutton, merged per cell by the grid builder.
  properties_layer: [19, 20]

time:
  total_years: 100
  nstp: 30
  tsmult: 1.2
  fine_period_years: 10
  output_years: [10, 50, 100]

solver:
  complexity: "MODERATE"

run:
  scenarios: ["A", "C", "L"]
  workspace_root: "/tmp/mf6_workspaces_hutton"

assessment:
  regulatory_threshold_m: 0.4
  spring_complex_col: complex_na
  spring_id_col: site_no
  # Theis comparison parameters — the department's standard assessment
  # values, so the Theis columns reproduce current practice (superposition
  # of Theis solutions). Comment out to fall back to formation-averaged
  # T (geometric mean) and S (median) over active cells.
  theis_T_m2_per_day: 50.0
  theis_S: 5.0e-4
  recharge_multiplier: 1.0
  # Boundary GHBs come from inputs.ghb_cells_csv (calibrated cells for
  # layers 19+20). The face/head settings below apply only if that file
  # goes missing; ghb_heads must NOT be "uwir2025_pilot" here — the pilot
  # table is Precipice layer-24 data.
  boundary_mode: "uwir_ghb"
  ghb_faces: ["W", "S"]           # UWIR 2025 App. F: Hutton has W heads + S conductances
  ghb_conductance_scale: 1.0
  ghb_heads: "ntop"
  outcrop_storage: "formation_sy" # uniform 5.878e-3 on both Hutton layers
  ic_source: "parent_predev"   # UWIR predev surface (see config.yaml)
  storage_mode: "convertible"     # Ss<->Sy switching, as in the parent model (see config.yaml)
  chd_quadrants: ["NW", "SE"]

# Vertical leakage (Hantush) — see config.yaml for the full notes.
# Interim source: Data/Hutton/predev_heads.csv; overlying-layer heads
# (adjacent_L18_heads.csv) arrive with the extraction extras.
leakage:
  enabled: false

drains:
  enabled: true
  # Calibrated surficial-drain stages/conductances from the parent model's
  # RIV package (layers 19+20 merged per cell).
  riv_cells_csv: "Data/Hutton/riv_cells.csv"
  conductance_m2_per_day: null
  conductance_scale: 1.0
